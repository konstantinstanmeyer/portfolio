<!doctype html>
<html><head><meta charset="utf-8"><title>buildtime</title>
<script type="importmap">{ "imports": { "three": "/vendor/build/three.module.js", "three/addons/": "/vendor/examples/jsm/" } }</script>
</head><body style="background:#000;color:#ccc;font:16px monospace">
<pre id="out">running</pre>
<script type="module">
import * as THREE from 'three';
const t0 = performance.now();
const mod = await import('./figure.js?v=' + Date.now());
const t1 = performance.now();
const runs = [];
for (let i = 0; i < 20; i++) { const a = performance.now(); const f = mod.createFigure(); runs.push(performance.now() - a); f.dispose(); }
const f = mod.createFigure();
const a = performance.now(); for (let i = 0; i < 2000; i++) f.update(i * 0.016, 0.016); const upd = (performance.now() - a) / 2000;
// first render incl. shader compile
const r = new THREE.WebGLRenderer(); r.setSize(200, 200); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1)); s.add(f.object);
const c = new THREE.PerspectiveCamera(35, 1, 0.1, 50); c.position.set(0, 1, 4); c.lookAt(0, 0.9, 0);
const b = performance.now(); r.render(s, c); r.getContext().finish(); const first = performance.now() - b;
const txt = `import+data ${(t1 - t0).toFixed(1)}ms | createFigure first ${runs[0].toFixed(2)}ms, median ${runs.sort((x, y) => x - y)[10].toFixed(2)}ms | update ${(upd * 1000).toFixed(1)}us | first render (compile) ${first.toFixed(1)}ms`;
document.getElementById('out').textContent = txt; console.warn(txt);
document.title = 'READY';
</script></body></html>
