<!doctype html>
<html><head><meta charset="utf-8"><title>cmp</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "/vendor/build/three.module.js", "three/addons/": "/vendor/examples/jsm/" } }</script>
</head><body>
<script type="module">
// Private comparison page: reference-like camera. ?cx=&cy=&cz=&fov=&t=
import * as THREE from 'three';
const { createFigure } = await import('./figure.js?v=' + Date.now());
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') || '#ffffff');
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(-4, 2, -2); scene.add(fill);
const f = createFigure(); scene.add(f.object); f.update(+(q.get('t') || 0), 1/60);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 38), W / H, 0.05, 100);
cam.position.set(+(q.get('cx') ?? -1.0), +(q.get('cy') ?? 1.7), +(q.get('cz') ?? 2.7));
cam.lookAt(0, +(q.get('ly') || 0.88), 0);
r.render(scene, cam);
document.title = 'READY';
</script></body></html>
