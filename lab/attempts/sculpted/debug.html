<!doctype html>
<html><head><meta charset="utf-8"><title>sculpted debug</title>
<style>html,body{margin:0;background:#f2f2f2;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "/vendor/build/three.module.js", "three/addons/": "/vendor/examples/jsm/" } }</script>
</head><body>
<script type="module">
// Dev-only close-up renderer: ?pos=x,y,z&look=x,y,z&fov=20&t=0&bg=f2f2f2
import * as THREE from 'three';
import { createFigure } from './figure.js';
const q = new URLSearchParams(location.search);
const v = (k, d) => (q.get(k) || d).split(',').map(Number);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#' + (q.get('bg') || 'f2f2f2'));
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(-4, 2, -2); scene.add(fill);
const fig = createFigure(); scene.add(fig.object); fig.update(+(q.get('t') || 0), 1 / 60);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 20), W / H, 0.01, 100);
cam.position.set(...v('pos', '0,1.6,1.2')); cam.lookAt(...v('look', '0,1.6,0'));
r.render(scene, cam); document.title = 'READY';
</script></body></html>
