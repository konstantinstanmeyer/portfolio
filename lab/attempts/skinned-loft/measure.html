<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>measuring</title>
<script type="importmap">
{ "imports": { "three": "/vendor/build/three.module.js", "three/addons/": "/vendor/examples/jsm/" } }
</script>
</head>
<body>
<pre id="out"></pre>
<script type="module">
// Measures foot sliding, ground contact, amplitudes and build/update cost.
import * as THREE from 'three';
const t0 = performance.now();
const mod = await import('./figure.js?v=' + Date.now());
const t1 = performance.now();
const fig = mod.createFigure();
const t2 = performance.now();
let mesh;
fig.object.traverse((o) => { if (o.isSkinnedMesh) mesh = o; });
const pos = mesh.geometry.attributes.position;
const n = pos.count;
const v = new THREE.Vector3();
const rest = [];
fig.update(0); fig.object.updateMatrixWorld(true);
for (let i = 0; i < n; i++) { mesh.getVertexPosition(i, v); rest.push(v.clone()); }
const footIdx = [];
for (let i = 0; i < n; i++) if (rest[i].y < 0.1) footIdx.push(i);
let maxFoot = 0, minY = Infinity, maxY = -Infinity, headMin = new THREE.Vector3(1e9, 1e9, 1e9), headMax = new THREE.Vector3(-1e9, -1e9, -1e9);
let maxAny = 0;
const top = rest.reduce((a, p, i) => (p.y > rest[a].y ? i : a), 0);
for (let t = 0; t <= 60; t += 0.2) {
  fig.update(t); fig.object.updateMatrixWorld(true);
  for (const i of footIdx) { mesh.getVertexPosition(i, v); maxFoot = Math.max(maxFoot, v.distanceTo(rest[i])); minY = Math.min(minY, v.y); }
  mesh.getVertexPosition(top, v); headMin.min(v); headMax.max(v); maxY = Math.max(maxY, v.y);
  for (let i = 0; i < n; i += 7) { mesh.getVertexPosition(i, v); maxAny = Math.max(maxAny, v.distanceTo(rest[i])); }
}
// update cost
const u0 = performance.now();
for (let k = 0; k < 2000; k++) fig.update(k * 0.016, 0.016);
const u1 = performance.now();
const out = {
  importMs: +(t1 - t0).toFixed(1), buildMs: +(t2 - t1).toFixed(1), updateUs: +((u1 - u0) / 2000 * 1000).toFixed(1),
  verts: n, tris: n / 3, footVerts: footIdx.length, maxFootSlideMm: +(maxFoot * 1000).toFixed(2), minY: +minY.toFixed(4),
  headRangeCm: headMax.clone().sub(headMin).multiplyScalar(100).toArray().map((x) => +x.toFixed(2)), maxVertexMoveCm: +(maxAny * 100).toFixed(2),
};
document.getElementById('out').textContent = JSON.stringify(out);
document.title = 'M ' + JSON.stringify(out);
</script>
</body>
</html>
